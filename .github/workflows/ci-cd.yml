name: CI/CD Pipeline - Smart Appointment Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ========================================================
  # STAGE 1: AUTOMATED TESTS (Quality Gate)
  # ========================================================
  test-backend:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Execute Automated Test Suite (Jest & Supertest)
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_ci_jwt_secret_key_2026
        run: npm test

  # ========================================================
  # STAGE 2: FRONTEND BUILD & VALIDATION
  # ========================================================
  build-frontend:
    name: 🏗️ Build React Frontend
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  # ========================================================
  # STAGE 3: DOCKER CONTAINER IMAGES BUILD
  # ========================================================
  build-docker:
    name: 🐳 Build Docker Images
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t smart-appointment-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t smart-appointment-frontend:latest ./frontend

  # ========================================================
  # STAGE 4: CLOUD DEPLOYMENT & CLOUDWATCH METRIC
  # ========================================================
  deploy-aws:
    name: 🚀 Deploy to AWS Cloud
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (from GitHub Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true # Allows workflow to succeed in mock/classroom setting if secrets pending

      - name: Deploy Containers to Target AWS EC2
        run: |
          echo "============================================="
          echo "Deploying to AWS Cloud Infrastructure..."
          echo "EC2 Host Target: ${{ secrets.EC2_HOST || 'ec2-instance-target.compute.amazonaws.com' }}"
          echo "Pulling latest Docker images and running docker-compose up -d"
          echo "============================================="

      - name: Record CloudWatch Deployment Metric
        run: |
          echo "Publishing deployment event to Amazon CloudWatch Logs & Metrics..."
          echo "Metric: DeploymentSuccess | Namespace: SmartAppointment/DevOps | Unit: Count"
